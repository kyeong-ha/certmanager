services:
  backend:
    volumes:
      - ./backend:/web/backend
      - ./backend/.local:/web/backend/.local
      - /mnt/host/d/Users/User/Desktop/Database:/web/backend/media
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    extra_hosts:
      - "certmanager-frontend:host-gateway"

  watcher:
    image: ${DOCKER_IMAGE:-certmanager-backend}
    container_name: certmanager-watcher
    command: python utils/xlsx_watcher.py
    volumes:
      - ./backend:/web/backend
      - ./backend/.local:/web/backend/.local
      - /mnt/host/d/Users/User/Desktop/Database:/web/backend/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env.dev
    depends_on:
      - backend

  frontend:
    volumes:
      - ./frontend:/web/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env.dev
    environment:
      - WATCHPACK_POLLING=true
      - DISABLE_HOST_CHECK=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - HOST=0.0.0.0
      
  db:
    volumes:
    - db:/web/db
    ports:
      - 5432:5432
    env_file:
      - ./.env.dev

  nginx:
    container_name: certmanager-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro     # live, archive, renewal 전체
      - certbot-lib:/var/lib/letsencrypt:ro
      - static_volume:/web/backend/.local/staticfiles
      - media_volume:/web/backend/.local/media
    ports:
      - "80:80"       # HTTP (Certbot challenge)
      - "443:443"     # HTTPS
      - "8080:443"    # HTTPS 호스트 8080 → 컨테이너 443
    depends_on:
      - backend
      - frontend

  certbot:
    build:
      context: .
      dockerfile: certbot/Dockerfile
    container_name: certmanager-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt       # live/archive/renewal 전체 (읽기/쓰기)
      - certbot-lib:/var/lib/letsencrypt   # internal 상태 저장소
      - ./certbot/www:/var/www/certbot:ro   # (선택) HTTP-01 웹루트
      - /var/run/docker.sock:/var/run/docker.sock   # Docker 소켓 (deploy-hook)
      - /usr/bin/docker:/usr/bin/docker:ro          # Docker CLI 바이너리
    entrypoint: ["/bin/sh","-c"]
    command:
      - >
        chmod 600 /etc/duckdns.ini &&
        if [ ! -f /etc/letsencrypt/live/certmanager.duckdns.org/fullchain.pem ]; then
          certbot certonly --non-interactive --agree-tos --email jobpyeong2@gmail.com \
            --authenticator dns-duckdns --dns-duckdns-credentials /etc/duckdns.ini \
            --dns-duckdns-propagation-seconds 60 -d certmanager.duckdns.org;
        fi &&
        while true; do
          certbot renew --non-interactive \
            --deploy-hook "docker exec certmanager-nginx nginx -s reload" \
            --disable-hook-validation;
          sleep 12h;
        done
    depends_on:
      - nginx

volumes:
  db:
  static_volume:
  media_volume:
  certbot-etc:
  certbot-lib: