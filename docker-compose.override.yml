services:
  backend:
    volumes:
      - ./backend:/web/backend
      - ./backend/.local:/web/backend/.local
      - /mnt/host/d/Users/User/Desktop/Database:/web/backend/media
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    extra_hosts:
      - "certmanager-frontend:host-gateway"

  watcher:
    image: ${DOCKER_IMAGE:-certmanager-backend}
    container_name: certmanager-watcher
    command: python utils/xlsx_watcher.py
    volumes:
      - ./backend:/web/backend
      - ./backend/.local:/web/backend/.local
      - /mnt/host/d/Users/User/Desktop/Database:/web/backend/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env.dev
    depends_on:
      - backend

  frontend:
    volumes:
      - ./frontend:/web/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env.dev
    environment:
      - WATCHPACK_POLLING=true

  db:
    volumes:
    - db:/web/db
    ports:
      - 5432:5432
    env_file:
      - ./.env.dev

